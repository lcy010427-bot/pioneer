# Free preview deployment. The filesystem is temporary: operator changes can be
# lost whenever Render replaces or restarts the instance.
services:
  - type: web
    name: pioneer
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PIONEER_USERNAME
        value: admin
      - key: PIONEER_ADMIN_PASSWORD
        sync: false
