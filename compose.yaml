name: pioneer
x-app: &app
  image: pioneer:${PIONEER_IMAGE_TAG:-local}
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 768m
  cpus: 2
  pids_limit: 96
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  app:
    <<: *app
    environment:
      PIONEER_DB: /data/pioneer.sqlite
      PIONEER_PUBLIC_ORIGIN: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
      PIONEER_PASSWORD_HASH: ${PIONEER_PASSWORD_HASH:?Configure an administrator password hash}
    volumes:
      - pioneer_data:/data
    networks: [admin_backend]
  public:
    <<: *app
    environment:
      PIONEER_DB: /data/pioneer.sqlite
      PIONEER_PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      PIONEER_ADMIN_ORIGIN: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
      PIONEER_READ_ONLY: '1'
    depends_on:
      app: {condition: service_healthy}
    volumes:
      - pioneer_data:/data:ro
    networks: [public_backend, search_egress]
  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      PIONEER_USERNAME: ${PIONEER_USERNAME:?Set PIONEER_USERNAME in .env}
      PIONEER_PASSWORD_HASH: ${PIONEER_PASSWORD_HASH:?Set PIONEER_PASSWORD_HASH in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: {condition: service_healthy}
      public: {condition: service_healthy}
    networks: [admin_backend, public_backend, edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 96
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  pioneer_data:
  caddy_data:
  caddy_config:
networks:
  admin_backend:
  public_backend:
    internal: true
  edge:
  search_egress:
